name: Migrar base de datos

# Aplica los archivos supabase/sql/*.sql (en orden) contra la base de datos de
# Supabase y publica un reporte de verificación.
#
# - Se ejecuta solo cuando cambia algo en supabase/sql/ (o a mano desde la
#   pestaña Actions → "Migrar base de datos" → Run workflow).
# - Necesita el secreto SUPABASE_DBURL (cadena de conexión al pooler).

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'supabase/sql/**'

permissions:
  contents: write

concurrency:
  group: migrar-bd
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Comprobar el secreto
        env:
          DB: ${{ secrets.SUPABASE_DBURL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::error::Falta el secreto SUPABASE_DBURL en este repositorio (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "Secreto presente. Aplicando migraciones…"

      - name: Aplicar migraciones (supabase/sql en orden)
        env:
          DB: ${{ secrets.SUPABASE_DBURL }}
        run: |
          cd supabase/sql
          for archivo in $(ls [0-9][0-9][0-9]_*.sql | sort); do
            echo "== Aplicando $archivo =="
            psql "$DB" -v ON_ERROR_STOP=1 -q -f "$archivo"
          done
          echo "Migraciones aplicadas sin errores."

      - name: Verificar la base de datos (reporte)
        env:
          DB: ${{ secrets.SUPABASE_DBURL }}
        run: |
          REPORTE=supabase/verificacion-ultima.txt
          {
            echo "# Verificación de la base de datos"
            echo ""
            echo "Fecha: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## Tablas de public"
            psql "$DB" -c '\dt public.*'
            echo "## Columnas de todas las tablas"
            psql "$DB" -c "select table_name, column_name, data_type from information_schema.columns where table_schema='public' and table_name in ('clientes','servicios','pagos','gastos','facturas','factura_items','igualas','crm_empresas','crm_contactos','crm_oportunidades','crm_actividades','seo_auditorias','solicitudes_servicio','talento_candidatos','talento_empresas','talento_vacantes','talento_postulaciones') order by table_name, ordinal_position;"
            echo "## Conteos"
            psql "$DB" -c "select 'clientes' as tabla, count(*) as filas from public.clientes union all select 'servicios', count(*) from public.servicios union all select 'pagos', count(*) from public.pagos union all select 'gastos', count(*) from public.gastos union all select 'facturas', count(*) from public.facturas union all select 'factura_items', count(*) from public.factura_items union all select 'igualas', count(*) from public.igualas union all select 'crm_empresas', count(*) from public.crm_empresas union all select 'crm_contactos', count(*) from public.crm_contactos union all select 'crm_oportunidades', count(*) from public.crm_oportunidades union all select 'crm_actividades', count(*) from public.crm_actividades union all select 'seo_auditorias', count(*) from public.seo_auditorias union all select 'solicitudes_servicio', count(*) from public.solicitudes_servicio union all select 'talento_candidatos', count(*) from public.talento_candidatos union all select 'talento_empresas', count(*) from public.talento_empresas union all select 'talento_vacantes', count(*) from public.talento_vacantes union all select 'talento_postulaciones', count(*) from public.talento_postulaciones;"
            echo "## Prueba de inserciones (se revierte al final)"
            psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $$
          declare c uuid; f uuid; e uuid; ct uuid; o uuid; s uuid; v_sol jsonb; tc uuid; te uuid; tv uuid;
          begin
            insert into public.clientes (nombre, empresa, estado) values ('__prueba_migracion__', 'Prueba', 'prospecto') returning id into c;
            insert into public.servicios (cliente_id, titulo, monto) values (c, '__prueba__', 10);
            insert into public.pagos (cliente_id, concepto, monto) values (c, '__prueba__', 5);
            insert into public.gastos (concepto, monto) values ('__prueba__', 3);
            insert into public.igualas (cliente_id, descripcion, monto_mensual) values (c, '__prueba__', 7);
            insert into public.facturas (cliente_id, cliente_nombre, numero, tipo, subtotal, itbis, total) values (c, '__prueba__', 'B0200000001', 'B02', 100, 18, 118) returning id into f;
            insert into public.factura_items (factura_id, descripcion, precio) values (f, '__prueba__', 100);
            insert into public.crm_empresas (nombre) values ('__prueba__') returning id into e;
            insert into public.crm_contactos (empresa_id, nombre) values (e, '__prueba__') returning id into ct;
            insert into public.crm_oportunidades (empresa_id, contacto_id, titulo, monto) values (e, ct, '__prueba__', 11) returning id into o;
            insert into public.crm_actividades (oportunidad_id, contacto_id, titulo, completada) values (o, ct, '__prueba__', true);
            insert into public.seo_auditorias (url, dominio, puntaje, datos) values ('https://ejemplo.com', 'ejemplo.com', 90, '{}'::jsonb);
            insert into public.solicitudes_servicio (solicitante_nombre, titulo, descripcion, origen)
              values ('__prueba__', '__prueba__', 'Descripción de prueba de la migración 009.', 'interno')
              returning id into s;
            insert into public.talento_candidatos (nombre, email, puesto_objetivo, consentimiento)
              values ('__prueba__', 'prueba@talento.test', '__prueba__', true)
              returning id into tc;
            insert into public.talento_empresas (nombre, contacto_nombre, contacto_email)
              values ('__prueba_talento__', '__prueba__', 'prueba@talento.test')
              returning id into te;
            insert into public.talento_vacantes (empresa_id, titulo, descripcion)
              values (te, '__prueba__', 'Descripción de prueba de la migración 010.')
              returning id into tv;
            insert into public.talento_postulaciones (candidato_id, empresa_id, vacante_id)
              values (tc, te, tv);
            v_sol := public.crear_solicitud_publica(
              '__prueba_publica__', 'Prueba', 'prueba@ejemplo.com', '8095550101',
              'https://ejemplo.com', 'seo', 'Auditoría de prueba',
              'Solicitud de prueba creada y cerrada por la función pública.', null, 100, 'media', null
            );
            perform public.finalizar_solicitud(
              (v_sol ->> 'id')::uuid, (v_sol ->> 'token')::uuid,
              '{"resumen":"prueba","entregables":["Entregable de prueba"]}'::jsonb,
              'Informe de prueba', 'Propuesta de prueba', 'Correo de prueba', 100,
              '{"url":"https://ejemplo.com","dominio":"ejemplo.com","puntaje":90,"datos":{}}'::jsonb
            );
            raise notice 'Inserciones de prueba: OK';
          end $$;
          rollback;
          SQL
            echo "## RLS: lectura simulando usuario autenticado"
            psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role authenticated;
          set local request.jwt.claims = '{"sub":"00000000-0000-0000-0000-000000000001","role":"authenticated"}';
          select (select count(*) from public.clientes) as clientes,
                 (select count(*) from public.servicios) as servicios,
                 (select count(*) from public.pagos) as pagos,
                 (select count(*) from public.gastos) as gastos,
                 (select count(*) from public.facturas) as facturas,
                 (select count(*) from public.factura_items) as factura_items,
                 (select count(*) from public.igualas) as igualas,
                 (select count(*) from public.crm_empresas) as crm_empresas,
                 (select count(*) from public.crm_contactos) as crm_contactos,
                 (select count(*) from public.crm_oportunidades) as crm_oportunidades,
                 (select count(*) from public.crm_actividades) as crm_actividades,
                 (select count(*) from public.seo_auditorias) as seo_auditorias,
                 (select count(*) from public.solicitudes_servicio) as solicitudes_servicio,
                 (select count(*) from public.talento_candidatos) as talento_candidatos,
                 (select count(*) from public.talento_empresas) as talento_empresas,
                 (select count(*) from public.talento_vacantes) as talento_vacantes,
                 (select count(*) from public.talento_postulaciones) as talento_postulaciones;
          rollback;
          SQL
            echo "## RLS: lectura como anónimo (debe dar 0 en todo)"
            psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role anon;
          select (select count(*) from public.clientes) as clientes,
                 (select count(*) from public.servicios) as servicios,
                 (select count(*) from public.pagos) as pagos,
                 (select count(*) from public.gastos) as gastos,
                 (select count(*) from public.facturas) as facturas,
                 (select count(*) from public.factura_items) as factura_items,
                 (select count(*) from public.igualas) as igualas,
                 (select count(*) from public.crm_empresas) as crm_empresas,
                 (select count(*) from public.crm_contactos) as crm_contactos,
                 (select count(*) from public.crm_oportunidades) as crm_oportunidades,
                 (select count(*) from public.crm_actividades) as crm_actividades,
                 (select count(*) from public.seo_auditorias) as seo_auditorias,
                 (select count(*) from public.solicitudes_servicio) as solicitudes_servicio;
          rollback;
          SQL
            echo "## Permisos directos de Talento para anónimo (debe ser false)"
            psql "$DB" -c "select has_table_privilege('anon','public.talento_candidatos','select') as candidatos, has_table_privilege('anon','public.talento_empresas','select') as empresas, has_table_privilege('anon','public.talento_vacantes','select') as vacantes, has_table_privilege('anon','public.talento_postulaciones','select') as postulaciones;"
            echo "## RPC pública como anónimo (crea y cierra con token; se revierte)"
            psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role anon;
          with creada as (
            select public.crear_solicitud_publica(
              'Prueba anónima', 'Prueba', 'anonimo@ejemplo.com', null, null,
              'consultoria', 'Solicitud anónima de prueba',
              'Descripción de prueba con más de veinte caracteres.', null, null, 'media', null
            ) as datos
          )
          select public.finalizar_solicitud(
            (datos ->> 'id')::uuid,
            (datos ->> 'token')::uuid,
            '{}'::jsonb, 'Informe de prueba', 'Propuesta de prueba', 'Correo de prueba', 0, null
          ) from creada;
          rollback;
          SQL
            echo "## RPC pública de Talento como anónimo (se revierte)"
            psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role anon;
          do $$
          declare v_cand jsonb; v_emp jsonb; v_vac jsonb;
          begin
            v_cand := public.crear_postulacion_publica(
              '__prueba_candidato_publico__', 'anonimo@talento.test', null, null,
              '__prueba_puesto__', 'mid', 'hibrido', array['Excel', 'NIIF'],
              null, null, null, null, null, null, null, true, true, null
            );
            v_emp := public.crear_empresa_y_solicitud(
              '__prueba_empresa_publica__', 'Prueba', null, null,
              '__prueba_contacto__', 'anonimo@talento.test', null,
              array[(v_cand ->> 'candidato_id')::uuid], 'entrevista',
              'Solicitud de prueba de Talento.', true
            );
            v_vac := public.crear_vacante_publica(
              '__prueba_empresa_publica__', 'Prueba', null, null,
              '__prueba_contacto__', 'anonimo@talento.test', null,
              '__prueba_vacante__', 'Descripción de prueba de la vacante pública.',
              null, null, 'hibrido', 'mid', 'tiempo_completo', null, null, true
            );
            perform public.listar_vacantes_publicas();
            perform public.listar_candidatos_publicos();
            raise notice 'Talento público: candidato %, empresa %, vacante %',
              v_cand ->> 'candidato_id', v_emp ->> 'empresa_id', v_vac ->> 'vacante_id';
          end $$;
          rollback;
          SQL
          } > "$REPORTE" 2>&1
          cat "$REPORTE"

      - name: Publicar el reporte en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/verificacion-ultima.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en el reporte."
          else
            git commit -m "reporte de migracion [skip ci]"
            git push
          fi
