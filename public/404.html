<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#003B72" />
    <title>Página no encontrada · AviTech Solutions Group</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Sofia Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(0, 123, 255, 0.09), transparent 42%),
          #ffffff;
      }
      main {
        width: min(100%, 560px);
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #0060c8;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        color: #003b72;
        font-size: clamp(32px, 7vw, 48px);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }
      p {
        margin: 16px auto 0;
        max-width: 430px;
        color: #5f6b7a;
        font-size: 15px;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        margin-top: 26px;
        padding: 14px 24px;
        border-radius: 12px;
        background: #003b72;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 16px 34px -20px rgba(0, 59, 114, 0.85);
        transition: background-color 150ms ease;
      }
      a:hover {
        background: #002c57;
      }
      a:focus-visible {
        outline: 3px solid #007bff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Página no encontrada</h1>
      <p>La dirección no existe o cambió. Vuelve al inicio para conocer los servicios de AviTech.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
